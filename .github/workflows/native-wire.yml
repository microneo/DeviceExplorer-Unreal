name: Native wire

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check explicit source list
        run: python Scripts/CheckWireSources.py
      - name: Configure
        run: cmake -S Native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
